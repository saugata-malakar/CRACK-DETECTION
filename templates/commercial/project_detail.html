{% extends "commercial/base.html" %}

{% block title %}Project Details - CrackDetect AI{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 pt-20">
    <!-- Animated Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
    </div>

    <div class="relative z-10 container mx-auto px-6 py-12">
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/projects" class="inline-flex items-center text-blue-400 hover:text-blue-300 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Back to Projects
            </a>
        </div>

        <!-- Project Header -->
        <div id="projectHeader" class="bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-lg p-8 mb-8">
            <!-- Project details will be loaded here -->
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap gap-4 mb-8">
            <button onclick="showAddSiteModal()" class="bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 text-white font-bold py-3 px-6 rounded-full transform hover:scale-105 transition-all duration-300">
                <i class="fas fa-plus mr-2"></i>Add Site
            </button>
            <button onclick="showAddTeamMemberModal()" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 px-6 rounded-full transform hover:scale-105 transition-all duration-300">
                <i class="fas fa-user-plus mr-2"></i>Add Team Member
            </button>
            <button onclick="generateProjectReport()" class="bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-700 hover:to-red-700 text-white font-bold py-3 px-6 rounded-full transform hover:scale-105 transition-all duration-300">
                <i class="fas fa-file-pdf mr-2"></i>Generate Report
            </button>
        </div>

        <!-- Tabs -->
        <div class="mb-8">
            <div class="flex space-x-1 bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-lg p-1">
                <button onclick="showTab('sites')" id="sitesTab" class="flex-1 py-3 px-6 rounded-lg text-white font-medium transition-all duration-300 tab-button active">
                    Sites
                </button>
                <button onclick="showTab('team')" id="teamTab" class="flex-1 py-3 px-6 rounded-lg text-white font-medium transition-all duration-300 tab-button">
                    Team
                </button>
                <button onclick="showTab('alerts')" id="alertsTab" class="flex-1 py-3 px-6 rounded-lg text-white font-medium transition-all duration-300 tab-button">
                    Alerts
                </button>
                <button onclick="showTab('timeline')" id="timelineTab" class="flex-1 py-3 px-6 rounded-lg text-white font-medium transition-all duration-300 tab-button">
                    Timeline
                </button>
            </div>
        </div>

        <!-- Tab Content -->
        <div id="sitesContent" class="tab-content">
            <div id="sitesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Sites will be loaded here -->
            </div>
            <div id="sitesEmpty" class="text-center py-16 hidden">
                <div class="text-6xl text-gray-400 mb-4">🏢</div>
                <h3 class="text-2xl font-bold text-white mb-2">No Sites Yet</h3>
                <p class="text-gray-400 mb-6">Add your first site to start organizing inspections</p>
                <button onclick="showAddSiteModal()" class="bg-gradient-to-r from-green-600 to-blue-600 text-white font-bold py-3 px-6 rounded-full">
                    Add Site
                </button>
            </div>
        </div>

        <div id="teamContent" class="tab-content hidden">
            <div id="teamList" class="space-y-4">
                <!-- Team members will be loaded here -->
            </div>
        </div>

        <div id="alertsContent" class="tab-content hidden">
            <div id="alertsList" class="space-y-4">
                <!-- Alerts will be loaded here -->
            </div>
        </div>

        <div id="timelineContent" class="tab-content hidden">
            <div id="timelineList" class="space-y-6">
                <!-- Timeline will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add Site Modal -->
    <div id="addSiteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">Add New Site</h3>
            
            <form id="addSiteForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Site Name</label>
                    <input type="text" id="siteName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="e.g., North Tower" required>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Site Type</label>
                    <select id="siteType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" required>
                        <option value="">Select Type</option>
                        <option value="Building">Building</option>
                        <option value="Bridge">Bridge</option>
                        <option value="Column">Column</option>
                        <option value="Beam">Beam</option>
                        <option value="Wall">Wall</option>
                        <option value="Deck">Deck</option>
                        <option value="Foundation">Foundation</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Address</label>
                    <input type="text" id="siteAddress" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="Full address">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Latitude</label>
                        <input type="number" step="any" id="siteLatitude" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="40.7128">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Longitude</label>
                        <input type="number" step="any" id="siteLongitude" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="-74.0060">
                    </div>
                </div>
                
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="hideAddSiteModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Add Site</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Team Member Modal -->
    <div id="addTeamMemberModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">Add Team Member</h3>
            
            <form id="addTeamMemberForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="memberEmail" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="colleague@company.com" required>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Role</label>
                    <select id="memberRole" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" required>
                        <option value="">Select Role</option>
                        <option value="Inspector">Inspector</option>
                        <option value="Engineer">Engineer</option>
                        <option value="Manager">Manager</option>
                        <option value="Viewer">Viewer</option>
                    </select>
                </div>
                
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="hideAddTeamMemberModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Add Member</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
@keyframes blob {
    0% { transform: translate(0px, 0px) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0px, 0px) scale(1); }
}

.animate-blob {
    animation: blob 7s infinite;
}

.animation-delay-2000 {
    animation-delay: 2s;
}

.tab-button.active {
    background: rgba(59, 130, 246, 0.5);
    backdrop-filter: blur(10px);
}

.site-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
}

.site-card:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.15);
}
</style>

<script>
let currentProject = null;
let projectId = null;

// Get project ID from URL
document.addEventListener('DOMContentLoaded', function() {
    const pathParts = window.location.pathname.split('/');
    projectId = pathParts[pathParts.length - 1];
    loadProjectDetails();
    loadSites();
    loadTeamMembers();
    loadAlerts();
    loadTimeline();
});

function loadProjectDetails() {
    fetch(`/api/projects/${projectId}`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                currentProject = data.project;
                renderProjectHeader();
            } else {
                console.error('Failed to load project:', data.error);
            }
        })
        .catch(error => {
            console.error('Error loading project:', error);
        });
}

function renderProjectHeader() {
    const header = document.getElementById('projectHeader');
    header.innerHTML = `
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-4xl font-bold text-white mb-2">${currentProject.name}</h1>
                <p class="text-xl text-gray-300">📍 ${currentProject.location}</p>
            </div>
            <div class="text-right">
                <span class="px-4 py-2 bg-blue-600 text-white rounded-full text-lg font-medium">${currentProject.project_type}</span>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="text-center">
                <div class="text-3xl font-bold text-blue-400">${currentProject.site_count || 0}</div>
                <div class="text-gray-300">Sites</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-green-400">${currentProject.inspection_count || 0}</div>
                <div class="text-gray-300">Inspections</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-yellow-400">${currentProject.team_count || 0}</div>
                <div class="text-gray-300">Team Members</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-red-400">${currentProject.alert_count || 0}</div>
                <div class="text-gray-300">Active Alerts</div>
            </div>
        </div>
        
        <div class="mt-6 text-sm text-gray-400">
            Created: ${new Date(currentProject.created_at).toLocaleDateString()} | 
            Last Updated: ${new Date(currentProject.updated_at || currentProject.created_at).toLocaleDateString()}
        </div>
    `;
}

function showTab(tabName) {
    // Hide all tab contents
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
    });
    
    // Remove active class from all tabs
    document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
    });
    
    // Show selected tab content
    document.getElementById(tabName + 'Content').classList.remove('hidden');
    document.getElementById(tabName + 'Tab').classList.add('active');
}

function loadSites() {
    fetch(`/api/projects/${projectId}/sites`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderSites(data.sites);
            }
        })
        .catch(error => console.error('Error loading sites:', error));
}

function renderSites(sites) {
    const grid = document.getElementById('sitesGrid');
    const empty = document.getElementById('sitesEmpty');
    
    if (sites.length === 0) {
        grid.style.display = 'none';
        empty.classList.remove('hidden');
        return;
    }
    
    grid.style.display = 'grid';
    empty.classList.add('hidden');
    
    grid.innerHTML = sites.map(site => `
        <div class="site-card rounded-lg p-6 cursor-pointer" onclick="viewSite(${site.id})">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white">${site.name}</h3>
                <span class="px-3 py-1 bg-green-600 text-white text-sm rounded-full">${site.site_type}</span>
            </div>
            
            <p class="text-gray-300 mb-4">📍 ${site.address || 'No address'}</p>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-400">${site.structure_count || 0}</div>
                    <div class="text-sm text-gray-400">Structures</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-green-400">${site.inspection_count || 0}</div>
                    <div class="text-sm text-gray-400">Inspections</div>
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-400">Health: ${site.health_score || 'N/A'}%</span>
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 bg-${site.health_score >= 80 ? 'green' : site.health_score >= 60 ? 'yellow' : 'red'}-500 rounded-full"></span>
                    <span class="text-sm text-gray-300">${site.health_score >= 80 ? 'Good' : site.health_score >= 60 ? 'Fair' : 'Poor'}</span>
                </div>
            </div>
        </div>
    `).join('');
}

function loadTeamMembers() {
    fetch(`/api/projects/${projectId}/team`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderTeamMembers(data.team_members);
            }
        })
        .catch(error => console.error('Error loading team members:', error));
}

function renderTeamMembers(members) {
    const list = document.getElementById('teamList');
    
    if (members.length === 0) {
        list.innerHTML = `
            <div class="text-center py-16">
                <div class="text-6xl text-gray-400 mb-4">👥</div>
                <h3 class="text-2xl font-bold text-white mb-2">No Team Members</h3>
                <p class="text-gray-400 mb-6">Add team members to collaborate on this project</p>
                <button onclick="showAddTeamMemberModal()" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-3 px-6 rounded-full">
                    Add Team Member
                </button>
            </div>
        `;
        return;
    }
    
    list.innerHTML = members.map(member => `
        <div class="bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-lg p-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                        ${member.username ? member.username.charAt(0).toUpperCase() : 'U'}
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-white">${member.username || 'Unknown User'}</h3>
                        <p class="text-gray-300">${member.email}</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="px-3 py-1 bg-blue-600 text-white text-sm rounded-full">${member.role}</span>
                    <p class="text-sm text-gray-400 mt-1">Added: ${new Date(member.added_at).toLocaleDateString()}</p>
                </div>
            </div>
        </div>
    `).join('');
}

function loadAlerts() {
    fetch(`/api/projects/${projectId}/alerts`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderAlerts(data.alerts);
            }
        })
        .catch(error => console.error('Error loading alerts:', error));
}

function renderAlerts(alerts) {
    const list = document.getElementById('alertsList');
    
    if (alerts.length === 0) {
        list.innerHTML = `
            <div class="text-center py-16">
                <div class="text-6xl text-gray-400 mb-4">🔔</div>
                <h3 class="text-2xl font-bold text-white mb-2">No Active Alerts</h3>
                <p class="text-gray-400">All systems are running smoothly</p>
            </div>
        `;
        return;
    }
    
    list.innerHTML = alerts.map(alert => `
        <div class="bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-lg p-6 border-l-4 border-${alert.severity === 'CRITICAL' ? 'red' : alert.severity === 'HIGH' ? 'orange' : alert.severity === 'MEDIUM' ? 'yellow' : 'blue'}-500">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">${alert.severity === 'CRITICAL' ? '🚨' : alert.severity === 'HIGH' ? '⚠️' : alert.severity === 'MEDIUM' ? '⚡' : 'ℹ️'}</span>
                    <div>
                        <h3 class="text-lg font-bold text-white">${alert.alert_type.replace('_', ' ')}</h3>
                        <p class="text-gray-300">${alert.message}</p>
                    </div>
                </div>
                <span class="px-3 py-1 bg-${alert.severity === 'CRITICAL' ? 'red' : alert.severity === 'HIGH' ? 'orange' : alert.severity === 'MEDIUM' ? 'yellow' : 'blue'}-600 text-white text-sm rounded-full">
                    ${alert.severity}
                </span>
            </div>
            <div class="text-sm text-gray-400">
                Created: ${new Date(alert.created_at).toLocaleString()}
            </div>
        </div>
    `).join('');
}

function loadTimeline() {
    fetch(`/api/projects/${projectId}/timeline`)
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                renderTimeline(data.timeline);
            }
        })
        .catch(error => console.error('Error loading timeline:', error));
}

function renderTimeline(timeline) {
    const list = document.getElementById('timelineList');
    
    if (timeline.length === 0) {
        list.innerHTML = `
            <div class="text-center py-16">
                <div class="text-6xl text-gray-400 mb-4">📅</div>
                <h3 class="text-2xl font-bold text-white mb-2">No Activity Yet</h3>
                <p class="text-gray-400">Project activity will appear here</p>
            </div>
        `;
        return;
    }
    
    list.innerHTML = timeline.map((item, index) => `
        <div class="flex items-start space-x-4">
            <div class="flex-shrink-0 w-4 h-4 bg-blue-500 rounded-full mt-2 relative">
                ${index < timeline.length - 1 ? '<div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-0.5 h-12 bg-gray-600"></div>' : ''}
            </div>
            <div class="flex-1 bg-white bg-opacity-10 backdrop-filter backdrop-blur-lg rounded-lg p-4">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-lg font-bold text-white">${item.event_type.replace('_', ' ')}</h3>
                    <span class="text-sm text-gray-400">${new Date(item.timestamp).toLocaleString()}</span>
                </div>
                <p class="text-gray-300">${item.description}</p>
            </div>
        </div>
    `).join('');
}

// Modal functions
function showAddSiteModal() {
    document.getElementById('addSiteModal').classList.remove('hidden');
}

function hideAddSiteModal() {
    document.getElementById('addSiteModal').classList.add('hidden');
}

function showAddTeamMemberModal() {
    document.getElementById('addTeamMemberModal').classList.remove('hidden');
}

function hideAddTeamMemberModal() {
    document.getElementById('addTeamMemberModal').classList.add('hidden');
}

function viewSite(siteId) {
    window.location.href = `/sites/${siteId}`;
}

function generateProjectReport() {
    window.open(`/reports/project/${projectId}/pdf`, '_blank');
}

// Form submissions
document.getElementById('addSiteForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
        project_id: projectId,
        name: document.getElementById('siteName').value,
        site_type: document.getElementById('siteType').value,
        address: document.getElementById('siteAddress').value,
        gps_lat: parseFloat(document.getElementById('siteLatitude').value) || null,
        gps_lon: parseFloat(document.getElementById('siteLongitude').value) || null
    };
    
    fetch('/api/sites/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            hideAddSiteModal();
            loadSites();
            loadProjectDetails(); // Refresh counts
            document.getElementById('addSiteForm').reset();
            alert('Site added successfully!');
        } else {
            alert('Error adding site: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error adding site:', error);
        alert('Error adding site. Please try again.');
    });
});

document.getElementById('addTeamMemberForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = {
        project_id: projectId,
        email: document.getElementById('memberEmail').value,
        role: document.getElementById('memberRole').value
    };
    
    fetch('/api/team/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            hideAddTeamMemberModal();
            loadTeamMembers();
            loadProjectDetails(); // Refresh counts
            document.getElementById('addTeamMemberForm').reset();
            alert('Team member added successfully!');
        } else {
            alert('Error adding team member: ' + data.error);
        }
    })
    .catch(error => {
        console.error('Error adding team member:', error);
        alert('Error adding team member. Please try again.');
    });
});
</script>
{% endblock %}
